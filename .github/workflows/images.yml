name: Build deployment images
on:
  workflow_dispatch:
    inputs:
      revision:
        description: Reviewed full commit SHA; defaults to this workflow revision
        type: string
        required: false
        default: ""
permissions:
  contents: read
  packages: write
jobs:
  verify:
    uses: ./.github/workflows/check.yml
    with:
      revision: ${{ inputs.revision || github.sha }}
  images:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: container-release
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ inputs.revision || github.sha }}
      - name: Authenticate registry
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Build and publish exact revision
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          repository="ghcr.io/${REPOSITORY,,}"
          source_revision=$(git rev-parse HEAD)
          targets=(account worker)
          if test -d src/apps/admin; then targets+=(admin); fi
          for target in "${targets[@]}"; do
            image="$repository/$target:$source_revision-$GITHUB_RUN_ID"
            docker build --build-arg "SOURCE_URL=https://github.com/$REPOSITORY/tree/$source_revision" --target "$target" --label "org.opencontainers.image.revision=$source_revision" -t "$image" .
            docker push "$image"
            docker inspect --format='{{index .RepoDigests 0}}' "$image" >> "$GITHUB_STEP_SUMMARY"
          done

          image="$repository/postgres:$source_revision-$GITHUB_RUN_ID"
          docker build -f deploy/postgres/Dockerfile --label "org.opencontainers.image.revision=$source_revision" -t "$image" .
          docker push "$image"
          docker inspect --format='{{index .RepoDigests 0}}' "$image" >> "$GITHUB_STEP_SUMMARY"
