name: Check
on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      revision:
        type: string
        required: false
        default: ""
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Validate exact source revision
        env:
          REQUESTED_REVISION: ${{ inputs.revision || github.sha }}
        run: '[[ "$REQUESTED_REVISION" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ inputs.revision || github.sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Reject high and critical dependency advisories
        run: bun audit --audit-level=high
      - run: bun run architecture && bun run typecheck && bun run lint
      - run: if test -f scripts/build-admin.ts; then bun scripts/build-admin.ts; fi
      - run: bun test --timeout 60000
      - name: Validate disabled deployment policy
        run: bun scripts/cloud-policy.ts validate config/cloud.json && bun scripts/cloud-policy.ts validate config/self-host.json && bun scripts/cloud-policy.ts validate config/staging.json
      - name: Verify backup scheduling boundaries
        run: |
          bash -n deploy/backups/common.sh deploy/backups/backup.sh deploy/backups/monitor.sh deploy/backups/alert.sh
          python3 deploy/backups/test_backups.py
      - name: Verify encrypted database backup restoration
        run: bun scripts/container-check.ts
      - name: Verify self-host Compose stack and private roles
        run: bun scripts/container-stack-check.ts
