# Hosted STAGING only: docker compose --env-file /absolute/path/staging.env -f deploy/compose.staging.yaml ...
# Disposable staging by default: no off-server backup until compose.staging-backups.yaml is applied.
# Policy activation is an explicit operator step through the policy service profile.
# API and worker images are built from reviewed source off the deployment host.
services:
  postgres:
    image: ${ZEPHIUM_POSTGRES_IMAGE:?Set a reviewed PostgreSQL 18.4 image digest}
    restart: unless-stopped
    environment:
      POSTGRES_USER: zephium_owner
      POSTGRES_DB: zephium
      POSTGRES_PASSWORD: ${POSTGRES_OWNER_PASSWORD:?Set the database owner password}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
      ZEPHIUM_BOOTSTRAP_ROLES: "true"
      ZEPHIUM_MIGRATOR_PASSWORD: ${ZEPHIUM_MIGRATOR_PASSWORD:?Set the migrator password}
      ZEPHIUM_APP_PASSWORD: ${ZEPHIUM_APP_PASSWORD:?Set the app password}
    volumes:
      - postgres-data:/var/lib/postgresql
    command: [postgres, -c, config_file=/etc/postgresql/zephium.conf, -c, archive_mode=off]
    networks: [database, egress]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U zephium_owner -d zephium"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
    mem_limit: 2g
    cpus: 1.5
    pids_limit: 256
    stop_grace_period: 60s
    security_opt: [no-new-privileges:true]

  migrate:
    image: ${ZEPHIUM_ACCOUNT_IMAGE:?Set a reviewed account image digest}
    restart: "no"
    user: bun
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=32m,mode=1777
    environment:
      DATABASE_URL: ${ZEPHIUM_MIGRATOR_DATABASE_URL:?Set the migrator database URL}
    command: [bun, scripts/migrate.ts]
    depends_on:
      postgres: { condition: service_healthy }
    networks: [database]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64
    stop_grace_period: 30s
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  policy:
    image: ${ZEPHIUM_ACCOUNT_IMAGE:?Set a reviewed account image digest}
    profiles: [operations]
    restart: "no"
    user: bun
    read_only: true
    environment:
      DATABASE_URL: ${ZEPHIUM_MIGRATOR_DATABASE_URL:?Set the migrator database URL}
      DB_POOL_SIZE: "4"
    command: [bun, scripts/cloud-policy.ts, register, /app/config/staging.json]
    volumes:
      - type: bind
        source: ./zephium-staging-policy.json
        target: /app/config/staging.json
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      migrate: { condition: service_completed_successfully }
    networks: [database]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  api:
    image: ${ZEPHIUM_ACCOUNT_IMAGE:?Set a reviewed account image digest}
    restart: unless-stopped
    user: bun
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=64m,mode=1777
    expose: ["3000"]
    environment:
      NODE_ENV: production
      DEPLOYMENT_MODE: hosted
      BILLING_ENABLED: ${BILLING_ENABLED:-false}
      POLAR_ENVIRONMENT: sandbox
      POLAR_ACCESS_TOKEN: ${POLAR_ACCESS_TOKEN:-}
      BILLING_SUCCESS_URL: ${BILLING_SUCCESS_URL:?Set the deployed staging checkout return URL}
      BILLING_RETURN_URL: ${BILLING_RETURN_URL:?Set the deployed staging portal return URL}
      POLAR_WEBHOOK_SECRET: ${POLAR_WEBHOOK_SECRET:-}
      POLAR_WEBHOOK_FORMAT: standard
      PORT: "3000"
      API_ORIGIN: ${API_ORIGIN:?Set the public HTTPS API origin}
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:?Set exact trusted HTTPS origins}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:?Set the observed trusted reverse-proxy CIDR}
      DATABASE_URL: ${ZEPHIUM_APP_DATABASE_URL:?Set the app database URL}
      DB_POOL_SIZE: "8"
      AUTH_SECRET: ${AUTH_SECRET:?Set an independent auth secret}
      ABUSE_SECRET: ${ABUSE_SECRET:?Set an independent abuse secret}
      ELIGIBILITY_SECRET: ${ELIGIBILITY_SECRET:?Set an independent eligibility secret}
      RESEND_API_KEY: ${RESEND_API_KEY:?Set your own Resend key}
      EMAIL_FROM: ${EMAIL_FROM:?Set your verified sender}
      SOURCE_URL: ${SOURCE_URL:?Set the public source URL for this release or fork}
      CLIENT_MIN_VERSION: ${CLIENT_MIN_VERSION:-1.0.0-beta.2}
      WAITLIST_ENABLED: ${WAITLIST_ENABLED:-false}
      WAITLIST_WEB_ORIGIN: ${WAITLIST_WEB_ORIGIN:-https://zephium.app}
      WAITLIST_REQUESTS_PER_MINUTE: ${WAITLIST_REQUESTS_PER_MINUTE:-30}
      WAITLIST_REQUESTS_PER_DAY: ${WAITLIST_REQUESTS_PER_DAY:-1000}
      SIGNUP_OPEN: ${SIGNUP_OPEN:-false}
      SIGNUP_EMAIL_ALLOWLIST: ${SIGNUP_EMAIL_ALLOWLIST:?Set exact approved staging email addresses}
      EMAIL_MAX_IN_FLIGHT: "4"
      BLOCK_DISPOSABLE_EMAIL: "true"
      CLOUD_CONFIG_PATH: /app/config/staging.json
      CLOUD_OPENAI_KEY: ${CLOUD_OPENAI_KEY:-}
      CLOUD_ANTHROPIC_KEY: ${CLOUD_ANTHROPIC_KEY:-}
      CLOUD_GOOGLE_KEY: ${CLOUD_GOOGLE_KEY:-}
      CLOUD_OPENROUTER_KEY: ${CLOUD_OPENROUTER_KEY:-}
      CLOUD_DEEPSEEK_KEY: ${CLOUD_DEEPSEEK_KEY:-}
      CLOUD_TYPESAFE_KEY: ${CLOUD_TYPESAFE_KEY:-}
    volumes:
      - type: bind
        source: ./zephium-staging-policy.json
        target: /app/config/staging.json
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      migrate: { condition: service_completed_successfully }
    networks: [database, egress, proxy]
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 128
    stop_grace_period: 45s
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  worker:
    image: ${ZEPHIUM_WORKER_IMAGE:?Set a reviewed worker image digest}
    restart: unless-stopped
    user: bun
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=16m,mode=1777
    environment:
      NODE_ENV: production
      DEPLOYMENT_MODE: hosted
      BILLING_ENABLED: ${BILLING_ENABLED:-false}
      POLAR_ENVIRONMENT: sandbox
      POLAR_ACCESS_TOKEN: ${POLAR_ACCESS_TOKEN:-}
      BILLING_SUCCESS_URL: ${BILLING_SUCCESS_URL:?Set the deployed staging checkout return URL}
      BILLING_RETURN_URL: ${BILLING_RETURN_URL:?Set the deployed staging portal return URL}
      DATABASE_URL: ${ZEPHIUM_APP_DATABASE_URL:?Set the app database URL}
      DB_POOL_SIZE: "4"
      OPERATIONS_WEBHOOK: ${OPERATIONS_WEBHOOK:?Set a private operational alert HTTPS endpoint}
      CLOUD_CONFIG_PATH: /app/config/staging.json
    volumes:
      - type: bind
        source: ./zephium-staging-policy.json
        target: /app/config/staging.json
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      migrate: { condition: service_completed_successfully }
    networks: [database, egress]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 96
    stop_grace_period: 45s
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

networks:
  database:
    internal: true
  egress: {}
  proxy:
    external: true
    name: ${ZEPHIUM_PROXY_NETWORK:?Set the dedicated staging proxy network}

volumes:
  postgres-data: {}
